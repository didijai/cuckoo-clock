<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <title>Learn Panel</title>

    <!-- The Learn module is kept fully self-contained: it owns its own
         layout, selection UI and question logic (see learn/ folder:
         core.js + math-level1.js + english-level1.js + ui.js). The parent
         clock page only shows/hides this iframe and reserves screen space.
         Using the same fonts/CDN as the parent so it looks native. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            overflow: hidden;
        }

        /* Scrollable content area (fallback if content ever grows) */
        .learn-scroll {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ----- Panel header ----- */
        .learn-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            background: linear-gradient(180deg, #3d2314 0%, #26140a 100%);
            border-bottom: 1px solid rgba(217, 119, 6, 0.45);
            flex-shrink: 0;
        }

        .learn-header-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(120, 53, 15, 0.6);
            border: 1px solid rgba(217, 119, 6, 0.5);
            color: #fbbf24;
        }

        .learn-header-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .learn-header-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 15px;
            color: #fcd34d;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .learn-header-subtitle {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fbbf24;
            opacity: 0.65;
            font-weight: 600;
        }

        /* ----- Body padding ----- */
        .learn-body {
            flex: 1;
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        /* ----- Section label ----- */
        .learn-label {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fcd34d;
            opacity: 0.7;
            font-weight: 700;
            margin-bottom: 7px;
        }

        /* ----- Type / Category chip rows ----- */
        .learn-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .learn-chip {
            padding: 8px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(217, 119, 6, 0.35);
            background: rgba(15, 23, 42, 0.7);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .learn-chip:hover:not(:disabled) {
            background: rgba(120, 53, 15, 0.6);
            color: #fef3c7;
        }

        .learn-chip.active {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #1c1917;
            border-color: rgba(251, 191, 36, 0.8);
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.45);
        }

        .learn-chip:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-style: dashed;
        }

        /* ----- Question card ----- */
        .question-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(217, 119, 6, 0.4);
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .question-card:hover {
            border-color: rgba(217, 119, 6, 0.7);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45), 0 0 14px rgba(217, 119, 6, 0.25);
        }

        .question-prompt {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 52px;
            line-height: 1.15;
            color: #fcd34d;
            text-shadow: 0 0 16px rgba(217, 119, 6, 0.35);
            white-space: nowrap;
        }

        /* Story mode (English word problems): wrapped, smaller, readable. */
        .question-text.story {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 19px;
            line-height: 1.55;
            white-space: normal;
            color: #fef3c7;
            text-shadow: none;
        }

        .answer-area {
            min-height: 40px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .answer-text {
            font-size: 40px;
            font-weight: 900;
            color: #4ade80;
            text-shadow: 0 0 16px rgba(74, 222, 128, 0.4);
        }

        .answer-sentence {
            font-size: 14px;
            font-weight: 600;
            color: #bbf7d0;
            line-height: 1.4;
        }

        .answer-placeholder {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ----- Action buttons ----- */
        .learn-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .learn-action {
            padding: 11px 10px;
            border-radius: 12px;
            border: 1px solid rgba(217, 119, 6, 0.45);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .learn-action:active {
            transform: scale(0.96);
        }

        .learn-action.primary {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #1c1917;
        }

        .learn-action.primary:hover {
            box-shadow: 0 0 16px rgba(217, 119, 6, 0.5);
        }

        .learn-action.ghost {
            background: rgba(120, 53, 15, 0.45);
            color: #fef3c7;
        }

        .learn-action.ghost:hover {
            background: rgba(180, 83, 9, 0.65);
        }

        /* ----- Cache / status footer ----- */
        .learn-footer {
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(217, 119, 6, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        .learn-cache-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #94a3b8;
        }

        .learn-cache-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
        }

        .learn-cache-dot.expired {
            background: #f59e0b;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.7);
        }

        /* ----- Math answer animation stage (preschool stepper) -----
           Group A = blue ring, group B = orange ring, total = green.
           All motion is transform/opacity only (cheap, no layout churn). */
        .anim-stage {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 6px 2px 2px;
        }

        .anim-stage[hidden] {
            display: none;
        }

        .anim-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            width: 100%;
        }

        .anim-glabel {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .anim-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
            /* Definite width (not fit-content): required — %-width items
               and cqw glyph sizing below cannot resolve against an
               indefinite flex cross size, and inline-size containment
               would otherwise collapse the row to 0. */
            width: 100%;
            max-width: 100%;
            /* Container for cqw glyph sizing: emoji font scales with ROW
               width, so glyphs keep air at any window size. */
            container-type: inline-size;
        }

        /* One ten being composed: 10 small in a dashed box.
           Definite width (not fit-content): same reason as .anim-row —
           inline-size containment would otherwise collapse the box and
           its cqw-sized glyphs to 0. */
        .anim-ten {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            justify-content: center;
            align-items: center;
            width: 210px;
            max-width: 100%;
            padding: 6px;
            border: 1.5px dashed rgba(148, 163, 184, 0.5);
            border-radius: 12px;
            transition: transform 0.7s ease-in, opacity 0.7s ease-in;
        }

        .anim-ten .anim-item {
            font-size: 22px;
        }

        /* Merge beat: the box squeezes into a glow ring, then 1 big pops. */
        .anim-ten.merging {
            transform: scale(0.15);
            opacity: 0;
            border-color: #fcd34d;
            box-shadow: 0 0 22px rgba(252, 211, 77, 0.8);
        }

        .anim-ten.merging-quick {
            transform: scale(0.15);
            opacity: 0;
            border-color: #fcd34d;
            box-shadow: 0 0 22px rgba(252, 211, 77, 0.8);
            transition-duration: 0.32s;
        }

        .anim-item {
            display: inline-flex;
            font-size: 40px;
            line-height: 1;
            transform: scale(0);
            opacity: 0;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
            position: relative;
        }

        .anim-item.in {
            transform: scale(1);
            opacity: 1;
        }

        .anim-item.ga {
            filter: drop-shadow(0 0 6px rgba(96, 165, 250, 0.55));
        }

        .anim-item.gb {
            filter: drop-shadow(0 0 6px rgba(251, 146, 60, 0.55));
        }

        /* Takeaway: circled, then flies off grey. */
        .anim-item.doomed {
            outline: 3px solid #f87171;
            outline-offset: 2px;
            border-radius: 50%;
            animation: anim-wiggle 0.5s ease-in-out 2;
        }

        .anim-item.gone {
            transform: translateY(-34px) scale(0.3);
            opacity: 0;
            filter: grayscale(1);
        }

        .anim-big {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            transform: scale(0);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s;
        }

        .anim-big.in {
            transform: scale(1);
            opacity: 1;
        }

        .anim-big.ga {
            background: rgba(37, 99, 235, 0.25);
            border: 3px solid #60a5fa;
            box-shadow: 0 0 16px rgba(96, 165, 250, 0.5);
        }

        .anim-big.gb {
            background: rgba(194, 65, 12, 0.3);
            border: 3px solid #fb923c;
            box-shadow: 0 0 16px rgba(251, 146, 60, 0.5);
        }

        .anim-big-e {
            font-size: 52px;
            line-height: 1;
        }

        .anim-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 28px;
            height: 28px;
            padding: 0 6px;
            border-radius: 9999px;
            background: #fcd34d;
            color: #1c1917;
            font-size: 14px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .anim-minibadge {
            position: absolute;
            bottom: 0;
            right: 0;
            min-width: 20px;
            height: 20px;
            padding: 0 4px;
            border-radius: 9999px;
            background: rgba(252, 211, 77, 0.95);
            color: #1c1917;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }

        .anim-minibadge.in {
            transform: scale(1);
        }

        /* Finale: everything left on stage cheers. */
        .anim-stage.finale .cheer {
            animation: anim-cheer 0.55s ease-in-out 2;
        }

        @keyframes anim-cheer {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.18) translateY(-8px); }
        }

        @keyframes anim-wiggle {
            0%, 100% { transform: scale(1) rotate(0); }
            25% { transform: scale(1.1) rotate(-8deg); }
            75% { transform: scale(1.1) rotate(8deg); }
        }

        /* Caption: color-matched breakdown, e.g. 20 + 7 = 27. */
        .anim-caption {
            font-size: 20px;
            font-weight: 800;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .anim-caption[hidden] {
            display: none;
        }

        .cap-n {
            padding: 2px 10px;
            border-radius: 10px;
        }

        .cap-a {
            background: rgba(37, 99, 235, 0.3);
            color: #bfdbfe;
        }

        .cap-b {
            background: rgba(194, 65, 12, 0.35);
            color: #fed7aa;
        }

        .cap-total {
            background: rgba(22, 101, 52, 0.5);
            color: #bbf7d0;
            font-size: 24px;
        }

        .cap-op {
            color: #94a3b8;
            font-weight: 700;
        }

        .cap-hint {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #fcd34d;
            border: 1px dashed rgba(252, 211, 77, 0.6);
            border-radius: 9999px;
            padding: 3px 10px;
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-item, .anim-big, .anim-ten {
                transition-duration: 0.01ms;
            }
            .anim-stage.finale .cheer, .anim-item.doomed {
                animation: none;
            }
        }

        /* Docked (framed beside the clock): category picking lives in
           the full tab only — hide the block, honour the stored set. */
        body:not(.popup) #categoryBlock {
            display: none;
        }

        /* Main column wrapper (card + actions + footer). Transparent by
           default so docked layout is byte-identical; popup mode makes it
           the right-hand column next to the picker sidebar. */
        .learn-main {
            display: contents;
        }

        /* ----- Popup (full-tab) mode: room to breathe -----
           Centered column, larger question + stage so the animation is
           the hero instead of squeezed beside the clock. */

        /* Docked (framed beside the clock): the outer panel header in
           index.html owns the title, so the inner header hides — one
           title bar total, same as the Media panel. The top-level popup
           keeps its own header. */
        body:not(.popup) .learn-header {
            display: none;
        }
        body.popup .learn-body {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 22px 28px;
            gap: 24px;
            /* Sidebar grid: pickers left (rows 1-2), card + actions right,
               status bottom-left under the sidebar. Frees the full card
               height for the question + stage. */
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            /* Sidebar stacks pickers, actions, status (spacer pushes the
               status to the bottom); the card spans full height. */
            grid-template-rows: auto auto minmax(0, 1fr) auto;
        }

        /* Picker sidebar. */
        body.popup .learn-pickrow {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 0;
        }

        body.popup .learn-pick {
            min-width: 0;
        }

        /* Content pieces are grid items via display:contents wrapper. */
        body.popup .learn-main {
            display: contents;
        }

        body.popup .question-card {
            grid-column: 2;
            grid-row: 1 / span 4;
            min-height: 0;
        }

        /* Animated math still reserves its stage (overrides the 0 above). */
        body.popup .question-card.has-stage {
            min-height: 577px;
        }

        /* Action buttons live in the sidebar under the pickers. */
        body.popup .learn-actions {
            grid-column: 1;
            grid-row: 2;
            grid-template-columns: minmax(0, 1fr);
        }

        body.popup .learn-footer {
            grid-column: 1;
            grid-row: 4;
            align-self: end;
        }

        /* Narrow popup windows fall back to the stacked layout. */
        @media (max-width: 700px) {
            body.popup .learn-body {
                display: flex;
                flex-direction: column;
            }

            body.popup .learn-main {
                display: flex;
                flex-direction: column;
                gap: 18px;
                min-width: 0;
            }

            body.popup .learn-pickrow {
                position: static;
            }

            body.popup .learn-actions {
                grid-template-columns: 1fr 1fr;
            }
        }

        body.popup .learn-header {
            padding: 14px 28px;
        }

        /* (Picker layout lives with the sidebar rules above.) */

        body.popup .question-card {
            padding: 30px 28px;
        }

        /* Inline answer: question and numeral share one row
           (4 + 3  =>  4 + 3 = 7) to save vertical space on short
           screens. Stage stays full-width below. */
        body.popup .question-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            /* Pack rows from the top: with the reserved min-height, growth
               extends downward only, so the question never drifts. */
            align-content: flex-start;
            justify-content: center;
            column-gap: 22px;
            row-gap: 4px;
        }

        body.popup .question-prompt {
            flex: 1 1 100%;
            margin-bottom: 0;
        }

        body.popup .answer-area {
            flex: 0 0 auto;
            flex-direction: row;
            align-items: center;
            min-height: 76px;
            margin-top: 0;
        }

        body.popup .anim-stage,
        body.popup .anim-caption {
            flex: 1 1 100%;
            min-width: 0;
        }

        /* Stable buttons: reserve the 80+10 worst case up front so the
           card doesn't grow tap-by-tap (measured 80+10 finale = 569px
           natural; 90+9 = 512px). min-height, not height — larger
           content still grows. Scoped to animated math via .has-stage
           (ui.js); English keeps its compact card. */
        body.popup .question-card.has-stage {
            min-height: 577px;
        }

        body.popup .question-text {
            font-size: 76px;
        }

        body.popup .question-text.story {
            font-size: 23px;
        }

        body.popup .answer-text {
            font-size: 72px;
        }

        body.popup .anim-stage {
            gap: 16px;
            padding-top: 10px;
        }

        /* Row capacity — guaranteed at ANY window width, not just
           desktop: bigs always 5 per row (6th wraps to row 2), row-level
           smalls always a single row of up to 10. Widths are row-relative
           so narrow windows shrink items instead of reflowing the count. */
        body.popup .anim-big {
            width: calc((100% - 24px) / 5);
            max-width: 112px;
            height: auto;
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
        }

        body.popup .anim-big-e {
            font-size: 68px;
            /* Box is ~20cqw wide (5 per row): 13cqw keeps glyphs clear. */
            font-size: min(68px, 13cqw);
        }

        body.popup .anim-row > .anim-item {
            width: calc((100% - 54px) / 10);
            flex: 0 0 auto;
            justify-content: center;
            font-size: 46px;
            /* Box is ~10cqw wide: 7cqw keeps ~30% air around the glyph. */
            font-size: min(46px, 7cqw);
        }

        body.popup .anim-ten {
            max-width: min(210px, 100%);
            padding: 10px;
            container-type: inline-size;
        }

        body.popup .anim-ten .anim-item {
            /* Exactly 5 per row: fractional cells, never content-sized.
               (Emoji advance width varies by browser/font — content sizing
               is what let a 6th item squeeze in on some browsers.) */
            flex: 0 0 calc((100% - 12px) / 5);
            justify-content: center;
            font-size: 26px;
            font-size: min(30px, 13cqw);
        }

        body.popup .anim-caption {
            font-size: 26px;
        }

        body.popup .cap-total {
            font-size: 32px;
        }

        body.popup .learn-action {
            padding: 14px 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="learn-scroll">
        <!-- Panel header -->
        <div class="learn-header">
            <div class="learn-header-icon">
                <!-- Graduation cap -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m0-6l-6.5-3.5M12 14l6.5-3.5" />
                </svg>
            </div>
            <div class="learn-header-text">
                <span class="learn-header-title">Learn Panel</span>
                <span class="learn-header-subtitle" id="learnSubtitle">Math · Level 1</span>
            </div>
        </div>

        <div class="learn-body">

            <!-- Learning type + category selection. Popup mode lays the
                 two blocks side by side in one row (see .learn-pickrow);
                 docked mode keeps them stacked. More types coming soon. -->
            <div class="learn-pickrow">
                <div class="learn-pick">
                    <div class="learn-label">Learning Type</div>
                    <div class="learn-chips" id="typeChips"></div>
                </div>

                <!-- Category selection: full-tab mode only. The docked
                     panel hides this block and honours the stored set. -->
                <div class="learn-pick" id="categoryBlock">
                    <div class="learn-label">Category</div>
                    <div class="learn-chips" id="categoryChips"></div>
                </div>
            </div>

            <!-- The active question (Math sums or English word problems),
                 action buttons and status: grouped in .learn-main so popup
                 mode can put the pickers in a left sidebar (the wrapper is
                 display:contents by default, so docked layout is unchanged). -->
            <div class="learn-main">
            <div class="question-card" title="Tap to hear the question again">
                <div class="question-prompt" id="questionPrompt">What is the answer?</div>
                <div class="question-text" id="questionText">…</div>
                <div class="answer-area" id="answerArea">
                    <span class="answer-placeholder" id="answerPlaceholder">Tap "Reveal Answer"</span>
                    <span class="answer-text" id="answerText" hidden></span>
                    <span class="answer-sentence" id="answerSentence" hidden></span>
                </div>
                <!-- Math answer animation stage (3-tap stepper). Sibling of
                     the answer row (NOT inside it) so the wide stage never
                     stretches the question row and forces a wrap. Hidden
                     until the first stepper tap; docked mode never shows it. -->
                <div class="anim-stage" id="answerAnim" hidden></div>
                <div class="anim-caption" id="answerAnimCap" hidden></div>
            </div>

            <!-- Reveal + New Question -->
            <div class="learn-actions">
                <button type="button" class="learn-action primary" id="revealBtn">Reveal Answer</button>
                <button type="button" class="learn-action ghost" id="newQuestionBtn">New Question</button>
            </div>

            <!-- Cache status -->
            <div class="learn-footer">
                <div class="learn-cache-note">
                    <span class="learn-cache-dot" id="cacheDot"></span>
                    <span id="cacheNote">Cached for 1 hour</span>
                </div>
            </div>
            </div><!-- /.learn-main -->
        </div>
    </div>

    <!-- Speech: self-contained TTS (local engine w/ Google fallback) -->
    <script src="tts.js"></script>

    <!-- Modular Learn logic (order matters: core first, ui last).
         core.js: registry + 1-hour cache + question lifecycle.
         math-level1.js / english-level1.js: subject generators.
         math-anim.js: Math Level 1 answer stepper (3-tap + ten-merge).
         ui.js: rendering + TTS wiring + controls + boot. -->
    <script src="learn/core.js"></script>
    <script src="learn/math-level1.js"></script>
    <script src="learn/english-level1.js"></script>
    <script src="learn/math-anim.js"></script>
    <script src="learn/ui.js"></script>
</body>

</html>
