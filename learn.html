<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <title>Learn Panel</title>

    <!-- The Learn module is kept fully self-contained: it owns its own
         layout, selection UI and question logic (see learn.js). The parent
         clock page only shows/hides this iframe and reserves screen space.
         Using the same fonts/CDN as the parent so it looks native. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            overflow: hidden;
        }

        /* Scrollable content area (fallback if content ever grows) */
        .learn-scroll {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ----- Panel header ----- */
        .learn-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            background: linear-gradient(180deg, #3d2314 0%, #26140a 100%);
            border-bottom: 1px solid rgba(217, 119, 6, 0.45);
            flex-shrink: 0;
        }

        .learn-header-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(120, 53, 15, 0.6);
            border: 1px solid rgba(217, 119, 6, 0.5);
            color: #fbbf24;
        }

        .learn-header-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .learn-header-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 15px;
            color: #fcd34d;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .learn-header-subtitle {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fbbf24;
            opacity: 0.65;
            font-weight: 600;
        }

        /* ----- Body padding ----- */
        .learn-body {
            flex: 1;
            min-height: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        /* ----- Section label ----- */
        .learn-label {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fcd34d;
            opacity: 0.7;
            font-weight: 700;
            margin-bottom: 7px;
        }

        /* ----- Type / Category chip rows ----- */
        .learn-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .learn-chip {
            padding: 8px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(217, 119, 6, 0.35);
            background: rgba(15, 23, 42, 0.7);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
        }

        .learn-chip:hover:not(:disabled) {
            background: rgba(120, 53, 15, 0.6);
            color: #fef3c7;
        }

        .learn-chip.active {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #1c1917;
            border-color: rgba(251, 191, 36, 0.8);
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.45);
        }

        .learn-chip:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-style: dashed;
        }

        /* ----- Question card ----- */
        .question-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(217, 119, 6, 0.4);
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .question-card:hover {
            border-color: rgba(217, 119, 6, 0.7);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45), 0 0 14px rgba(217, 119, 6, 0.25);
        }

        .question-prompt {
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 52px;
            line-height: 1.15;
            color: #fcd34d;
            text-shadow: 0 0 16px rgba(217, 119, 6, 0.35);
            white-space: nowrap;
        }

        .answer-area {
            min-height: 40px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-text {
            font-size: 40px;
            font-weight: 900;
            color: #4ade80;
            text-shadow: 0 0 16px rgba(74, 222, 128, 0.4);
        }

        .answer-placeholder {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ----- Action buttons ----- */
        .learn-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .learn-action {
            padding: 11px 10px;
            border-radius: 12px;
            border: 1px solid rgba(217, 119, 6, 0.45);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .learn-action:active {
            transform: scale(0.96);
        }

        .learn-action.primary {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #1c1917;
        }

        .learn-action.primary:hover {
            box-shadow: 0 0 16px rgba(217, 119, 6, 0.5);
        }

        .learn-action.ghost {
            background: rgba(120, 53, 15, 0.45);
            color: #fef3c7;
        }

        .learn-action.ghost:hover {
            background: rgba(180, 83, 9, 0.65);
        }

        /* ----- Cache / status footer ----- */
        .learn-footer {
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(217, 119, 6, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-shrink: 0;
        }

        .learn-cache-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #94a3b8;
        }

        .learn-cache-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
        }

        .learn-cache-dot.expired {
            background: #f59e0b;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.7);
        }
    </style>
</head>

<body>
    <div class="learn-scroll">
        <!-- Panel header -->
        <div class="learn-header">
            <div class="learn-header-icon">
                <!-- Graduation cap -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m0-6l-6.5-3.5M12 14l6.5-3.5" />
                </svg>
            </div>
            <div class="learn-header-text">
                <span class="learn-header-title">Learn Panel</span>
                <span class="learn-header-subtitle">Math · Level 1</span>
            </div>
        </div>

        <div class="learn-body">

            <!-- Learning type selection (panel-side). More types coming soon. -->
            <div>
                <div class="learn-label">Learning Type</div>
                <div class="learn-chips" id="typeChips"></div>
            </div>

            <!-- Category selection (panel-side). More categories coming soon. -->
            <div>
                <div class="learn-label">Category</div>
                <div class="learn-chips" id="categoryChips"></div>
            </div>

            <!-- The active question (kid-friendly addition) -->
            <div class="question-card">
                <div class="question-prompt" id="questionPrompt">What is the answer?</div>
                <div class="question-text" id="questionText">…</div>
                <div class="answer-area" id="answerArea">
                    <span class="answer-placeholder" id="answerPlaceholder">Tap "Reveal Answer"</span>
                    <span class="answer-text" id="answerText" hidden></span>
                </div>
            </div>

            <!-- Reveal + New Question -->
            <div class="learn-actions">
                <button type="button" class="learn-action primary" id="revealBtn">Reveal Answer</button>
                <button type="button" class="learn-action ghost" id="newQuestionBtn">New Question</button>
            </div>

            <!-- Cache status -->
            <div class="learn-footer">
                <div class="learn-cache-note">
                    <span class="learn-cache-dot" id="cacheDot"></span>
                    <span id="cacheNote">Cached for 1 hour</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Speech: self-contained TTS (local engine w/ Google fallback) -->
    <script src="tts.js"></script>

    <!-- Separate logic file: question rules + localStorage 1-hour cache -->
    <script src="learn.js"></script>
</body>

</html>
