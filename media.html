<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <title>Media Panel</title>

    <!-- Self-contained like learn.html: same fonts, chalet/amber theme.
          Embeds a private Google Drive folder (photo/audio/video) and
          auto-rotates through it. Drive Sign In/Out lives in the parent
          Settings panel and drives this iframe via postMessage; the parent
          also pushes the rotation interval.
          Popup mode: opened standalone as media.html?popup=1 (via the
          panel's "Open in New Tab" / header pop-out), body.popup widens
          the layout (fluid browse grid, taller stage) and the header owns
          its own Sign In/Out button since no Settings parent exists. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Author styles must never override the `hidden` attribute —
           otherwise the photo/video/audio layers all show at once. */
        [hidden] { display: none !important; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            overflow: hidden;
        }

        .media-scroll {
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ----- Panel header (mirrors learn-header) ----- */
        .media-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            background: linear-gradient(180deg, #3d2314 0%, #26140a 100%);
            border-bottom: 1px solid rgba(217, 119, 6, 0.45);
            flex-shrink: 0;
        }
        .media-header-icon {
            flex-shrink: 0;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: rgba(120, 53, 15, 0.6);
            border: 1px solid rgba(217, 119, 6, 0.5);
            color: #fbbf24;
        }
        .media-header-text { display: flex; flex-direction: column; line-height: 1.2; flex: 1; min-width: 0; }
        .media-header-title {
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px;
            color: #fcd34d; letter-spacing: 0.5px; line-height: 1.2;
        }
        .media-header-subtitle {
            font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
            color: #fbbf24; opacity: 0.65; font-weight: 600;
        }

        .media-body {
            flex: 1; min-height: 0; padding: 14px;
            display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto;
        }

        .media-label {
            font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
            color: #fcd34d; opacity: 0.7; font-weight: 700; margin-bottom: 7px;
        }

        /* Docked in the side panel, the outer panel chrome already shows
           the "Media Gallery" title — hide this inner header so the title
           appears exactly once. Standalone popup tab (body.popup) keeps
           it (it owns the Sign In button there). */
        body:not(.popup) .media-header { display: none; }

        /* ----- Header actions (popup tab only, since the header above is
           docked-hidden): Sign In/Out owns auth standalone; pop-out is a
           fallback when this page is framed with ?popup=1. ----- */
        .media-header-actions {
            margin-left: auto; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
            border: 1px solid rgba(217, 119, 6, 0.45);
            background: rgba(120, 53, 15, 0.55); color: #fbbf24;
            transition: background 0.2s, transform 0.15s;
            font-size: 14px; line-height: 1; padding: 0;
        }
        .icon-btn:hover { background: rgba(180, 83, 9, 0.75); }
        .icon-btn:active { transform: scale(0.92); }
        .auth-btn {
            border: 1px solid rgba(217, 119, 6, 0.45);
            background: rgba(120, 53, 15, 0.55); color: #fef3c7;
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px;
            padding: 7px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
        }
        .auth-btn:hover { background: rgba(180, 83, 9, 0.75); }
        /* Standalone popup tab (body.popup): auth lives here, pop-out is hidden. */
        body.popup #popoutBtn { display: none; }
        #authBtn { display: none; }
        body.popup #authBtn { display: inline-block; }

        /* ----- Single-row toolbar: Viewer/Browse + Prev/Pause/Next -----
           One flex row (wraps only on extremely narrow widths) so the
           five buttons share a single compact strip instead of two rows. */
        .media-toolbar {
            display: flex; gap: 8px; align-items: stretch; flex-shrink: 0;
        }
        .view-toggle {
            flex: 0 0 auto; display: flex; gap: 0;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(217, 119, 6, 0.35);
            border-radius: 12px; padding: 3px;
        }
        .view-toggle button {
            border: 0; background: transparent; color: #94a3b8;
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px;
            padding: 7px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .view-toggle button.active {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #1c1917; box-shadow: 0 0 12px rgba(217, 119, 6, 0.45);
        }

        /* ----- Stage ----- */
        .stage-card {
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(217, 119, 6, 0.4);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
        }
        .stage-meta {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 12px;
            border-bottom: 1px solid rgba(217, 119, 6, 0.2);
        }
        .type-badge {
            flex-shrink: 0; font-size: 9px; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 9999px;
            border: 1px solid rgba(217, 119, 6, 0.5);
            background: rgba(120, 53, 15, 0.55); color: #fcd34d;
        }
        .type-badge.video { background: rgba(30, 58, 138, 0.6); border-color: rgba(96,165,250,.5); color: #bfdbfe; }
        .type-badge.audio { background: rgba(20, 83, 45, 0.6); border-color: rgba(74,222,128,.5); color: #bbf7d0; }
        .file-name {
            flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: #e2e8f0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-count { flex-shrink: 0; font-size: 11px; color: #94a3b8; font-variant-numeric: tabular-nums; }

        .stage-view {
            position: relative; width: 100%; height: 250px;
            background: #020617;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .stage-view img {
            max-width: 100%; max-height: 100%; width: auto; height: auto;
            object-fit: contain; background: #020617; margin: auto;
        }
        .stage-view video {
            width: 100%; height: 100%; object-fit: contain; background: #000; margin: auto;
        }
        .audio-wrap {
            width: 100%; max-height: 100%; margin: auto;
            padding: 18px 14px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
        }
        .audio-disc {
            width: 92px; height: 92px; border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #f59e0b 0 8%, #1c1917 9% 38%, #44403c 39% 41%, #1c1917 42% 100%);
            border: 2px solid rgba(217, 119, 6, 0.6);
            box-shadow: 0 0 18px rgba(217, 119, 6, 0.35);
            display: flex; align-items: center; justify-content: center;
            animation: spin 8s linear infinite; animation-play-state: paused;
        }
        .audio-disc.playing { animation-play-state: running; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .audio-wrap audio { width: 100%; height: 32px; accent-color: #d97706; }

        .stage-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; height: 100%; padding: 20px; text-align: center; color: #64748b;
            font-size: 12px; line-height: 1.5; margin: auto;
        }

        /* progress bar: fills over the rotation interval (images) */
        .progress-track { height: 3px; background: rgba(148,163,184,.15); }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            box-shadow: 0 0 8px rgba(217,119,6,.6);
            transition: width 0.25s linear;
        }
        .progress-fill.waiting { background: linear-gradient(90deg, #16a34a, #4ade80); }

        /* ----- Controls (right half of the single-row toolbar) ----- */
        .media-controls {
            flex: 1 1 auto; min-width: 0;
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
        }
        .media-btn {
            padding: 7px 2px; border-radius: 10px; font-weight: 700; font-size: 11px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
            border: 1px solid rgba(217, 119, 6, 0.45); white-space: nowrap; min-width: 0;
            transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
        }
        .media-btn:active { transform: scale(0.96); }
        .media-btn.primary { background: linear-gradient(180deg, #d97706 0%, #b45309 100%); color: #1c1917; }
        .media-btn.primary:hover { box-shadow: 0 0 16px rgba(217, 119, 6, 0.5); }
        .media-btn.ghost { background: rgba(120, 53, 15, 0.45); color: #fef3c7; }
        .media-btn.ghost:hover { background: rgba(180, 83, 9, 0.65); }
        .media-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ----- Browse grid: fluid columns from available width -----
           auto-fill + minmax replaces the old hardcoded 3-per-row so the
           grid uses narrow docked panels and wide popup tabs equally well. */
        .browse-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px;
            overflow-y: auto;
        }
        .browse-cell {
            border: 1px solid rgba(217, 119, 6, 0.3); background: #020617;
            border-radius: 12px; overflow: hidden; cursor: pointer; padding: 0;
            display: flex; flex-direction: column;
            transition: border-color .2s, box-shadow .2s, transform .15s;
        }
        .browse-cell:hover { border-color: rgba(251,191,36,.7); transform: translateY(-1px); }
        .browse-cell.active {
            border-color: rgba(251,191,36,.9);
            box-shadow: 0 0 12px rgba(217,119,6,.55);
        }
        .browse-thumb {
            width: 100%; aspect-ratio: 1 / 1; background: #020617;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-size: 26px;
        }
        .browse-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .browse-thumb.video { background: linear-gradient(180deg, #172554, #020617); }
        .browse-thumb.audio { background: linear-gradient(180deg, #052e16, #020617); }
        .browse-name {
            font-size: 9px; color: #cbd5e1; padding: 5px 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-top: 1px solid rgba(217, 119, 6, 0.2);
        }
        .browse-empty {
            grid-column: 1 / -1; font-size: 11px; color: #475569;
            text-align: center; padding: 18px 8px; line-height: 1.6;
        }

        /* ----- Single status bar: auth + count on the left, slideshow
           state on the right. Replaces the old two-row layout (separate
           Drive-status card + "Every Xs" note that duplicated "Next in Xs"). */
        .media-footer {
            margin-top: auto; padding-top: 8px;
            border-top: 1px solid rgba(217, 119, 6, 0.2);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            flex-shrink: 0; font-size: 10px; color: #94a3b8;
        }
        .status-group {
            display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 auto;
        }
        .status-group.right { justify-content: flex-end; flex: 0 1 auto; }
        .status-group span:last-child {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        .auth-dot {
            flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%;
            background: #64748b;
        }
        .auth-dot.signed { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.7); }
        .rotate-dot {
            flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
        }
        .rotate-dot.paused { background: #64748b; box-shadow: none; }

        /* ----- Popup (full-tab) mode: body.popup is set when media.html
           runs standalone (opened via the panel's "Open in New Tab").
           Full-bleed layout: no centering cap, and the viewer stage /
           browse grid stretch to fill leftover vertical space. ----- */
        body.popup .media-body {
            max-width: none; width: 100%; margin: 0;
            padding: 20px 32px; gap: 16px;
        }
        @media (min-width: 1600px) {
            body.popup .media-body { padding: 24px 48px; }
        }
        body.popup .media-header { padding: 14px 32px; }
        body.popup .media-header-title { font-size: 17px; }
        body.popup #viewerView { flex: 1; min-height: 0; }
        body.popup .stage-card {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
        }
        body.popup .stage-view {
            flex: 1 1 auto; height: auto;
            min-height: clamp(300px, calc(100vh - 340px), 780px);
        }
        body.popup #browseView { flex: 1; min-height: 0; }
        body.popup .browse-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
            flex: 1; min-height: 0; align-content: start;
        }
        body.popup .browse-name { font-size: 11px; padding: 7px 8px; }
        body.popup .media-toolbar { gap: 12px; }
        /* Popup: cap the three control buttons and center them in the
           leftover space instead of stretching them across the tab. */
        body.popup .media-controls {
            grid-template-columns: repeat(3, minmax(96px, 150px));
            justify-content: center; align-content: stretch;
        }
        body.popup .view-toggle button { font-size: 12px; padding: 8px 16px; }
        body.popup .media-btn { font-size: 12px; padding: 8px 6px; }
        body.popup .media-footer { font-size: 11px; }
        /* Extremely narrow docked widths: let the toolbar wrap instead of
           crushing the five buttons into one row. */
        @media (max-width: 300px) {
            .media-toolbar { flex-wrap: wrap; }
            .view-toggle { flex: 1 1 100%; }
            .view-toggle button { flex: 1; }
        }
    </style>
</head>

<body>
    <div class="media-scroll">
        <div class="media-header">
            <div class="media-header-icon">
                <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16l4-4 4 4 4-4 4 4M4 6h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1zm3 4a1.5 1.5 0 100-3 1.5 1.5 0 000 3z" />
                </svg>
            </div>
            <div class="media-header-text">
                <span class="media-header-title">Media Gallery</span>
                <span class="media-header-subtitle">Photo · Audio · Video</span>
            </div>
            <div class="media-header-actions">
                <!-- Popup tab owns its auth (no Settings parent there). -->
                <button type="button" class="auth-btn" id="authBtn">Sign In</button>
                <!-- Docked panel: pop out into a standalone full tab. -->
                <button type="button" class="icon-btn" id="popoutBtn" title="Open in New Tab">↗</button>
            </div>
        </div>

        <div class="media-body">
            <!-- Single-row toolbar: Viewer/Browse + Prev/Pause/Next share one strip. -->
            <div class="media-toolbar" role="toolbar" aria-label="Gallery controls">
                <div class="view-toggle" role="tablist" aria-label="Gallery view">
                    <button type="button" id="viewerTab" class="active" role="tab">Viewer</button>
                    <button type="button" id="browseTab" role="tab">Browse</button>
                </div>
                <div class="media-controls">
                    <button type="button" class="media-btn ghost" id="prevBtn" disabled>‹ Prev</button>
                    <button type="button" class="media-btn ghost" id="playBtn" disabled>⏸ Pause</button>
                    <button type="button" class="media-btn ghost" id="nextBtn" disabled>Next ›</button>
                </div>
            </div>

            <!-- Single-item viewer (slideshow) -->
            <div id="viewerView" style="display:flex;flex-direction:column;gap:12px">
                <div class="stage-card">
                    <div class="stage-meta">
                        <span class="type-badge" id="typeBadge">—</span>
                        <span class="file-name" id="fileName">No media loaded</span>
                        <span class="file-count" id="fileCount"></span>
                    </div>
                    <div class="stage-view" id="stageView">
                        <div class="stage-empty" id="stageEmpty">
                            <span style="font-size:26px">🖼️</span>
                            <span>Sign in via Settings → Media<br>to load photos, audio &amp; video.</span>
                        </div>
                        <img id="photoEl" alt="" hidden>
                        <video id="videoEl" controls playsinline preload="auto" hidden></video>
                        <div class="audio-wrap" id="audioWrap" hidden>
                            <div class="audio-disc" id="audioDisc">
                                <span style="font-size:30px">🎵</span>
                            </div>
                            <audio id="audioEl" controls preload="auto"></audio>
                        </div>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                </div>
            </div>

            <!-- Thumbnail browse grid (lightweight thumbnailLinks only —
                 full files are never downloaded for the grid) -->
            <div id="browseView" hidden style="flex-direction:column;gap:8px">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                    <div class="media-label" id="browseCount" style="margin-bottom:0"></div>
                    <button type="button" class="media-btn ghost" id="refreshBtn"
                        style="padding:6px 10px;font-size:11px;flex-shrink:0" title="Re-list the Drive folder and refresh thumbnails">↻ Refresh</button>
                </div>
                <div class="browse-grid" id="browseGrid"></div>
            </div>

            <!-- Single status bar: auth + item count | slideshow state.
                 The old separate Drive-status card and the "Every Xs" note
                 (which duplicated "Next in Xs") are folded into this row. -->
            <div class="media-footer">
                <div class="status-group">
                    <span class="auth-dot" id="authDot"></span>
                    <span id="authStatus">Not signed in — use Settings → Media to sign in</span>
                </div>
                <div class="status-group right">
                    <span class="rotate-dot paused" id="rotateDot"></span>
                    <span id="rotateNote">Sign in to load media</span>
                </div>
            </div>
        </div>
    </div>

    <script src="media.js"></script>
</body>

</html>
